name: Update Spamhaus Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Run Script
        shell: powershell
        run: |
          ./update-spamhaus.ps1

      - name: Commit Changes
        shell: powershell
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add *.txt

          git diff --staged --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes."
          }
          else {
            git commit -m "Update Spamhaus feeds"
            git push
          }
