name: Update Spamhaus Feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Spamhaus Update Script
        shell: powershell
        run: |
          ./update-spamhaus.ps1

      - name: Commit and Push Changes
        shell: powershell
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          git add *.txt

          git diff --staged --quiet

          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes."
          }
          else {
            git commit -m "Update Spamhaus IPv4 and IPv6 feeds"
            git push
          }
